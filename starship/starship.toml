add_newline = true
command_timeout = 200
follow_symlinks = true
format = """
[\\[](bold red)$username[@](bold red)$hostname[\\[](bold red)[$directory]($style)[\\]](bold red)
[$git_branch$git_status]($style)$character
"""

## custom dir ($PWD)
# format = """
# [\\[](bold red)$username[@](bold red)$hostname[\\[](bold red)[${custom.pwd}[\\]](bold red)
# $git_branch$git_status]($style)$character
# """

[username]
format = "[$user]($style)"
show_always = true

style_user = "bold red"
[hostname]
format = "[$hostname](bold red)[\\]](bold red)[$ssh_symbol](bold green)"
ssh_only = false
ssh_symbol = "\\[SSH\\]"
disabled = false

[character]
## defaults
# error_symbol = "[✗](bold red)"
# success_symbol = "[❯](bold red)"
error_symbol = "[✗](bold red)"
success_symbol = "[\\$](bold red)"

## Default dir config
[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
home_symbol = "~"
truncate_to_repo = false
truncation_length = 200
truncation_symbol = "…/"
# repo_root_style = "bold red"
# repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"

## Using the full working dir #########
# Disable the built-in directory module
# [directory]
# disabled = true

# Replace it with a custom module
# [custom.pwd]
# command = "echo $PWD"
# when = "true"
# format = "[$output]($style)"
# style = "bold red"
# #####################################

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

